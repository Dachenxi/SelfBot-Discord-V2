services:
  backend:
    build:
      context: . 
      dockerfile: ./src/Dockerfile
    container_name: SelfBot-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build:
      context: . 
      dockerfile: ./frontend/Dockerfile
    container_name: SelfBot-frontend
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      - PORT=5174
      - NODE_ENV=production
      - ORIGIN=http://localhost:5174 # Ganti dengan IP VPS nanti
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge