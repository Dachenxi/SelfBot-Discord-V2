services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    networks:
      - selfbot-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
      ORIGIN: http://localhost:4173
    env_file:
      - ./frontend/.env
    ports:
      - "4173:4173"
    networks:
      - selfbot-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  selfbot-network:
    driver: bridge